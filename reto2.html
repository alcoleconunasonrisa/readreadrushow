<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Reto 2: La Serpiente Matemática - Búsqueda del Tesoro</title>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #6a5acd;
            --tablero: #fefae0;
            --snake-head: #2ecc71;
            --snake-body: #27ae60;
            --accent: #ff9f43;
            --correct: #2ecc71;
            --wrong: #ff6b6b;
            --food: #ff6b6b;
        }

        * { touch-action: none; box-sizing: border-box; }

        body {
            background-color: var(--bg);
            margin: 0; padding: 10px;
            font-family: 'Fredoka', sans-serif;
            display: flex; flex-direction: column; align-items: center;
            min-height: 100vh; color: white; overflow: hidden;
        }

        .btn-top {
            position: absolute; top: 10px;
            background: white; border: none; border-radius: 50%;
            width: 45px; height: 45px; cursor: pointer;
            box-shadow: 0 4px 0 rgba(0,0,0,0.2);
            font-size: 1.2rem; display: flex; align-items: center; justify-content: center;
            text-decoration: none; z-index: 20; color: #2d3748;
        }

        .btn-home { left: 10px; }
        .btn-pause { right: 10px; display: none; }

        #math-card {
            background: white; color: #2d3748;
            padding: 10px 30px; border-radius: 50px;
            margin-bottom: 15px; font-size: clamp(1.5rem, 6vw, 2.3rem); font-weight: 600;
            box-shadow: 0 6px 0 rgba(0,0,0,0.2);
            z-index: 5; min-height: 80px; display: flex; align-items: center;
            text-align: center; justify-content: center; width: 95%; max-width: 500px;
            border: 4px solid var(--accent);
            animation: bounceIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        @keyframes bounceIn {
            0% { transform: scale(0.3); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }

        #game-container {
            position: relative; background: #483d8b;
            padding: 12px; border-radius: 25px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.4);
            width: 95vw; max-width: 420px; 
        }

        canvas {
            display: block; background-color: var(--tablero);
            width: 100%; height: auto; 
            border-radius: 15px; aspect-ratio: 1 / 1;
        }

        .overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(45, 55, 72, 0.95); border-radius: 15px;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            z-index: 10; text-align: center; padding: 25px;
        }

        .play-btn {
            padding: 18px 40px; background: var(--correct); color: white; border: none; 
            border-radius: 15px; font-weight: 600; cursor: pointer; font-family: 'Fredoka'; font-size: 1.4rem;
            box-shadow: 0 5px 0 #27ae60; margin-top: 15px; transition: 0.2s;
        }
        .play-btn:active { transform: translateY(4px); box-shadow: 0 1px 0 #27ae60; }

        #score-tag {
            background: var(--accent); padding: 5px 15px; border-radius: 15px;
            font-weight: 600; margin-bottom: 10px; align-self: flex-center;
            text-align: center; width: 100%; font-size: 1.1rem;
        }
    </style>
</head>
<body>

    <a href="tesoro.html" class="btn-top btn-home">🏠</a>
    <button id="pause-btn" class="btn-top btn-pause" onclick="togglePausa()">⏸️</button>

    <div id="math-card">¡RETO 2: SERPIENTE MATEMÁTICA!</div>

    <div id="game-container">
        <div id="score-tag">OPERACIONES COMPLETADAS: <span id="score-val">0 / 20</span></div>
        <canvas id="gameCanvas" width="400" height="400"></canvas>
        
        <div id="menu-overlay" class="overlay">
            <h2 id="status-title" style="color:var(--accent); margin:0 0 10px 0; font-size: 2rem;">¿LISTOS/AS?</h2>
            <p id="status-desc" style="margin-bottom: 15px; font-size: 1.1rem; line-height: 1.4;">Resuelve los cálculos mentales comiendo la respuesta correcta. ¡Debes lograr 20 aciertos para revelar el tesoro!</p>

            <button id="main-action-btn" class="play-btn" onclick="iniciarJuego()">¡EMPEZAR RETO!</button>
        </div>
    </div>

    <script>
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");
        const box = 20; 
        const gridCount = canvas.width / box;

        let audioCtx, currentVelocity = 240; // Velocidad equilibrada para niños de 9 años
        let serpiente, direccion, siguienteDir, foods, currentTask, score, loop;
        let juegoActivo = false;
        let enPausa = false;
        let modoTesoroFinal = false; // Indica si ya se desbloqueó el regalo final
        const META_CALCULOS = 20;

        function playSound(type) {
            if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            const now = audioCtx.currentTime;

            switch(type) {
                case 'pop':
                    osc.type = 'sine'; osc.frequency.setValueAtTime(400, now);
                    gain.gain.setValueAtTime(0.1, now); gain.gain.linearRampToValueAtTime(0, now + 0.1);
                    osc.start(); osc.stop(now + 0.1); break;
                case 'correct':
                    osc.type = 'triangle'; osc.frequency.setValueAtTime(523, now);
                    osc.frequency.exponentialRampToValueAtTime(783, now + 0.1);
                    gain.gain.setValueAtTime(0.1, now); gain.gain.exponentialRampToValueAtTime(0.01, now + 0.3);
                    osc.start(); osc.stop(now + 0.3); break;
                case 'wrong':
                    osc.type = 'sawtooth'; osc.frequency.setValueAtTime(150, now);
                    gain.gain.setValueAtTime(0.1, now); gain.gain.linearRampToValueAtTime(0, now + 0.4);
                    osc.start(); osc.stop(now + 0.4); break;
                case 'hit':
                    osc.type = 'square'; osc.frequency.setValueAtTime(100, now);
                    gain.gain.setValueAtTime(0.1, now); gain.gain.linearRampToValueAtTime(0, now + 0.2);
                    osc.start(); osc.stop(now + 0.2); break;
                case 'start':
                    osc.type = 'sine'; osc.frequency.setValueAtTime(300, now);
                    osc.frequency.exponentialRampToValueAtTime(600, now + 0.2);
                    gain.gain.setValueAtTime(0.1, now); osc.start(); osc.stop(now + 0.3); break;
                case 'victory':
                    osc.type = 'sine'; osc.frequency.setValueAtTime(523, now); // Do
                    osc.frequency.setValueAtTime(659, now + 0.1); // Mi
                    osc.frequency.setValueAtTime(783, now + 0.2); // Sol
                    osc.frequency.setValueAtTime(1046, now + 0.3); // Do alto
                    gain.gain.setValueAtTime(0.1, now); gain.gain.linearRampToValueAtTime(0, now + 0.6);
                    osc.start(); osc.stop(now + 0.6); break;
            }
        }

        function togglePausa() {
            if (!juegoActivo) return;
            enPausa = !enPausa;
            const btn = document.getElementById("pause-btn");
            const overlay = document.getElementById("menu-overlay");
            const title = document.getElementById("status-title");
            const desc = document.getElementById("status-desc");
            const actionBtn = document.getElementById("main-action-btn");
            
            playSound('pop');

            if (enPausa) {
                clearInterval(loop);
                btn.innerText = "▶️";
                title.innerText = "PAUSA";
                desc.innerText = "La partida está en pausa. ¡Recupera fuerzas, grumete!";
                actionBtn.style.display = "none";
                overlay.style.display = "flex";
            } else {
                btn.innerText = "⏸️";
                overlay.style.display = "none";
                loop = setInterval(gameLoop, currentVelocity);
            }
        }

        function generarOperacion() {
            // Si ya se ha alcanzado la meta, activamos el evento del cofre final
            if (score >= META_CALCULOS) {
                modoTesoroFinal = true;
                document.getElementById("math-card").innerText = "¡CATCH THE TREASURE! 🎁";
                foods = [{...getFreePos(), val: "🎁", correct: true, isTreasure: true}];
                return;
            }

            // Selector aleatorio de tipo de cálculo: 0: Suma, 1: Resta, 2: Multiplicación, 3: División
            const tipo = Math.floor(Math.random() * 4);
            let num1, num2, res, pregunta;

            if (tipo === 0) { // SUMAS HASTA EL 20
                res = Math.floor(Math.random() * 19) + 2; // Resultado entre 2 y 20
                num1 = Math.floor(Math.random() * (res - 1)) + 1;
                num2 = res - num1;
                pregunta = `${num1} + ${num2}`;
            } else if (tipo === 1) { // RESTAS SIN NEGATIVOS HASTA EL 20
                num1 = Math.floor(Math.random() * 19) + 2; // Primero entre 2 y 20
                num2 = Math.floor(Math.random() * num1);   // El segundo nunca es mayor que el primero
                res = num1 - num2;
                pregunta = `${num1} - ${num2}`;
            } else if (tipo === 2) { // MULTIPLICACIONES HASTA EL 10
                num1 = Math.floor(Math.random() * 9) + 2; // Entre 2 y 10
                num2 = Math.floor(Math.random() * 9) + 1; // Entre 1 y 9
                res = num1 * num2;
                pregunta = `${num1} × ${num2}`;
            } else { // DIVISIONES EXACTAS HASTA LAS TABLAS DEL 10
                res = Math.floor(Math.random() * 9) + 2;  // Cociente entero entre 2 y 10
                num2 = Math.floor(Math.random() * 8) + 2; // Divisor entre 2 y 9
                num1 = res * num2;                        // Dividendo exacto
                pregunta = `${num1} ÷ ${num2}`;
            }

            currentTask = { q: pregunta, a: res };
            document.getElementById("math-card").innerText = currentTask.q;

            // Colocar la comida correcta
            foods = [{...getFreePos(), val: res, correct: true, isTreasure: false}];
            
            // Colocar 2 alternativas falsas numéricas y lógicas coherentes
            while(foods.length < 3) {
                let falsa = res + (Math.floor(Math.random() * 4) + 1) * (Math.random() > 0.5 ? 1 : -1);
                if(falsa >= 0 && !foods.some(f => f.val === falsa)) {
                    foods.push({...getFreePos(), val: falsa, correct: false, isTreasure: false});
                }
            }
        }

        function getFreePos() {
            let p;
            while(true) {
                p = { x: Math.floor(Math.random()*(gridCount-2)+1)*box, y: Math.floor(Math.random()*(gridCount-2)+1)*box };
                if(!serpiente.some(s => s.x===p.x && s.y===p.y) && !foods?.some(f => f.x===p.x && f.y===p.y)) return p;
            }
        }

        function gameLoop() {
            if (!juegoActivo || enPausa) return;
            direccion = Birmingham = siguienteDir;
            let hX = serpiente[0].x, hY = serpiente[0].y;

            if(direccion === "LEFT") hX -= box; 
            else if(direccion === "UP") hY -= box;
            else if(direccion === "RIGHT") hX += box; 
            else if(direccion === "DOWN") hY += box;

            let eatIdx = foods.findIndex(f => f.x === hX && f.y === hY);
            if(eatIdx !== -1) {
                if(foods[eatIdx].correct) {
                    if (foods[eatIdx].isTreasure) {
                        // ¡La serpiente se ha comido el cofre final! Victoria absoluta.
                        playSound('victory');
                        finalizarAventuraExito();
                        return;
                    } else {
                        // Acierto intermedio
                        playSound('correct'); 
                        score++;
                        document.getElementById("score-val").innerText = `${score} / ${META_CALCULOS}`;
                        generarOperacion();
                    }
                } else {
                    playSound('wrong'); 
                    finalizarJuego("¡RESPUESTA INCORRECTA!", "¡Vaya! Ese número no correspondía al cálculo. ¡No te rindas e inténtalo de nuevo!"); 
                    return;
                }
            } else { serpiente.pop(); }

            // Comprobación de colisiones con los bordes o consigo misma
            if(hX < 0 || hY < 0 || hX >= canvas.width || hY >= canvas.height || serpiente.some(s => s.x === hX && s.y === hY)) {
                playSound('hit'); 
                finalizarJuego("¡CHOQUE EN EL MAR!", "La serpiente chocó contra el arrecife o contra sí misma. ¡Pon atención al timón!"); 
                return;
            }

            serpiente.unshift({x: hX, y: hY});
            dibujar();
        }

        function dibujar() {
            ctx.fillStyle = "#fefae0";
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            foods.forEach(f => {
                if (f.isTreasure) {
                    // Renderizado del emoji del regalo/cofre en el mapa de juego
                    ctx.font = "18px Fredoka"; ctx.textAlign = "center";
                    ctx.fillText("🎁", f.x + box/2, f.y + box/2 + 6);
                } else {
                    ctx.fillStyle = "#ff6b6b";
                    ctx.beginPath(); ctx.arc(f.x + box/2, f.y + box/2, box/2 - 1, 0, Math.PI*2); ctx.fill();
                    ctx.fillStyle = "white"; ctx.font = "bold 12px Fredoka"; ctx.textAlign = "center";
                    ctx.fillText(f.val, f.x + box/2, f.y + box/2 + 4);
                }
            });

            serpiente.forEach((s, i) => {
                const isHead = i === 0;
                ctx.fillStyle = isHead ? "#2ecc71" : `rgb(39, ${174 - (i*2)}, 96)`;
                ctx.beginPath(); ctx.roundRect(s.x+1, s.y+1, box-2, box-2, isHead ? 8 : 4); ctx.fill();
                if(isHead) {
                    ctx.fillStyle = "white";
                    let e1, e2;
                    if(direccion === "RIGHT"){ e1={x:14,y:5}; e2={x:14,y:15}; }
                    else if(direccion === "LEFT"){ e1={x:6,y:5}; e2={x:6,y:15}; }
                    else if(direccion === "UP"){ e1={x:5,y:6}; e2={x:15,y:6}; }
                    else { e1={x:5,y:14}; e2={x:15,y:14}; }
                    ctx.beginPath(); ctx.arc(s.x+e1.x, s.y+e1.y, 3, 0, Math.PI*2); ctx.fill();
                    ctx.beginPath(); ctx.arc(s.x+e2.x, s.y+e2.y, 3, 0, Math.PI*2); ctx.fill();
                }
            });
        }

        function iniciarJuego() {
            playSound('start');
            serpiente = [{x: 5*box, y: 10*box}, {x: 4*box, y: 10*box}, {x: 3*box, y: 10*box}];
            direccion = "RIGHT"; siguienteDir = "RIGHT";
            score = 0; 
            modoTesoroFinal = false;
            document.getElementById("score-val").innerText = `0 / ${META_CALCULOS}`;
            juegoActivo = true; enPausa = false;
            
            document.getElementById("pause-btn").style.display = "flex";
            document.getElementById("pause-btn").innerText = "⏸️";
            
            document.getElementById("menu-overlay").style.display = "none";
            generarOperacion();
            if(loop) clearInterval(loop);
            loop = setInterval(gameLoop, currentVelocity);
        }

        function finalizarJuego(titulo, descripcion) {
            juegoActivo = false; clearInterval(loop);
            document.getElementById("pause-btn").style.display = "none";
            
            const overlay = document.getElementById("menu-overlay");
            const btn = document.getElementById("main-action-btn");
            
            document.getElementById("status-title").innerText = titulo;
            document.getElementById("status-desc").innerText = descripcion;
            document.getElementById("math-card").innerText = "¡FIN DEL INTENTO!";
            
            btn.style.display = "block";
            btn.style.background = "var(--wrong)";
            btn.style.boxShadow = "0 5px 0 #c0392b";
            btn.innerText = "REINTENTAR RETO 🔄";
            btn.onclick = () => { location.reload(); };
            
            overlay.style.display = "flex";
        }

        function finalizarAventuraExito() {
            juegoActivo = false; clearInterval(loop);
            document.getElementById("pause-btn").style.display = "none";
            
            const overlay = document.getElementById("menu-overlay");
            const btn = document.getElementById("main-action-btn");
            
            document.getElementById("status-title").innerText = "¡RETO 2 COMPLETADO! 🏆";
            document.getElementById("status-desc").innerText = "¡Increíble, tripulación! Vuestra agilidad matemática ha capturado el cofre mágico. ¡El segundo candado ha saltado por los aires!";
            document.getElementById("math-card").innerText = "¡VICTORIA! 🎉";
            
            btn.style.display = "block";
            btn.style.background = "var(--correct)";
            btn.style.boxShadow = "0 5px 0 #1b9e52";
            btn.innerText = "AVANZAR AL RETO 3 ➔";
            btn.onclick = () => {
                // Aquí conectarás con la web de tu tercer ejercicio en el futuro
                window.location.href = "reto3.html"; 
            };
            
            overlay.style.display = "flex";
        }

        // Eventos de control teclado físico
        window.addEventListener("keydown", e => {
            if(enPausa || !juegoActivo) return;
            const k = {"ArrowUp":"UP","w":"UP","ArrowDown":"DOWN","s":"DOWN","ArrowLeft":"LEFT","a":"LEFT","ArrowRight":"RIGHT","d":"RIGHT"};
            if(k[e.key]) {
                const n = k[e.key], o = {"UP":"DOWN","DOWN":"UP","LEFT":"RIGHT","RIGHT":"LEFT"};
                if(n !== o[direccion]) siguienteDir = n;
                e.preventDefault();
            }
        });

        // Eventos de control táctil (móviles/tablets)
        let tX, tY;
        document.addEventListener('touchstart', e => { tX = e.touches[0].clientX; tY = e.touches[0].clientY; }, {passive: true});
        document.addEventListener('touchend', e => {
            if(enPausa || !juegoActivo) return;
            let dx = e.changedTouches[0].clientX - tX, dy = e.changedTouches[0].clientY - tY;
            if(Math.abs(dx) > Math.abs(dy)) {
                if(Math.abs(dx)>20) siguienteDir = dx>0 ? (direccion!=="LEFT"?"RIGHT":direccion) : (direccion!=="RIGHT"?"LEFT":direccion);
            } else {
                if(Math.abs(dy)>20) siguienteDir = dy>0 ? (direccion!=="UP"?"DOWN":direccion) : (direccion!=="DOWN"?"UP":direccion);
            }
        }, {passive: true});

        // Dibujo de inicio estático en el lienzo
        serpiente = [{x: 5*box, y: 10*box}, {x: 4*box, y: 10*box}, {x: 3*box, y: 10*box}];
        direccion = "RIGHT";
        foods = [];
        dibujar(); 
    </script>
</body>
</html>
